# Compila a app da TV em cada push e deixa o APK para descarregar (29/9/2026): a
# sessao na nuvem nao chega ao repositorio Maven da Google, e assim a compilacao
# prova-se aqui e o Francisco instala sem compilar no Mac.
name: apk
on:
  push:
  workflow_dispatch:
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # A chave de assinatura tem de ser sempre a mesma (29/9/2026): sem keystore proprio o Gradle
      # cria uma chave de debug nova em cada maquina do GitHub, e a TV recusa por cima um APK com
      # outra assinatura (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Fica guardada na cache do GitHub, fora
      # do repositorio. 1/10/2026: a cache e' por ramo, e o ramo de trabalho e o main tinham cada um a
      # sua chave, por isso cada APK pedia para desinstalar o anterior. Agora so o main guarda a chave;
      # os outros ramos leem a do main (o GitHub deixa ler a cache do ramo principal).
      - uses: actions/cache/restore@v4
        id: chave
        with:
          path: ~/.android/debug.keystore
          key: assinatura-tv-main
      - name: Chave nova so no main
        if: steps.chave.outputs.cache-hit != 'true' && github.ref != 'refs/heads/main'
        run: echo "::warning::Sem chave do main na cache; este APK sai com uma chave provisoria."
      # A chave propria da app (4/10/2026): com os segredos TV_KEYSTORE_B64 e TV_KEYSTORE_PROPRIEDADES a release assina sempre com
      # a mesma chave (caramelotv.keystore), e cada versao instala-se por cima da anterior, a mao ou sozinha (Atualizacao.kt). A cache
      # da chave de debug falhava: cada compilacao do main saia com uma chave nova e a TV pedia para desinstalar.
      - name: Chave de assinatura da app
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
          TV_KEYSTORE_PROPRIEDADES: ${{ secrets.TV_KEYSTORE_PROPRIEDADES }}
        run: |
          if [ -z "$TV_KEYSTORE_B64" ] || [ -z "$TV_KEYSTORE_PROPRIEDADES" ]; then echo "::warning::Sem a chave propria: a release sai com a chave de debug."; exit 0; fi
          printf '%s' "$TV_KEYSTORE_B64" | base64 -d > caramelotv.keystore
          printf '%s\n' "$TV_KEYSTORE_PROPRIEDADES" > keystore.properties
      - name: Compilar a release
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/cache/save@v4
        if: steps.chave.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: ~/.android/debug.keystore
          key: assinatura-tv-main
      - name: Lint (informativo, nao bloqueia)
        continue-on-error: true
        run: ./gradlew --no-daemon lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: caramelotv-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-lint
          path: app/build/reports/lint-results-release.html
          retention-days: 14
      # A TV atualiza-se sozinha (4/10/2026): a release do main vai para o site, que a serve em /tv/caramelotv.apk; a app pergunta
      # de hora a hora por /tv/versao.json. Sem o segredo TV_APK_SEGREDO no repositorio, o passo nao faz nada.
      - name: Publicar a versao para a TV
        if: github.ref == 'refs/heads/main'
        env:
          TV_APK_SEGREDO: ${{ secrets.TV_APK_SEGREDO }}
        run: |
          if [ -z "$TV_APK_SEGREDO" ]; then echo "::warning::Sem TV_APK_SEGREDO: a TV nao recebe esta versao sozinha."; exit 0; fi
          curl -fsS -X POST -H "x-segredo: $TV_APK_SEGREDO" -H "content-type: application/octet-stream" \
            --data-binary @app/build/outputs/apk/release/app-release.apk \
            "https://caramelodobrasil.eu/api/tv/apk?versao=$GITHUB_RUN_NUMBER&nome=1.0.$GITHUB_RUN_NUMBER"
